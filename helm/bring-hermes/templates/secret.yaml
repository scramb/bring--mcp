{{- if not .Values.bring.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bring-hermes.fullname" . }}
  labels:
    {{- include "bring-hermes.labels" . | nindent 4 }}
type: Opaque
stringData:
  BRING_EMAIL: {{ required "bring.email is required when bring.existingSecret is not set" .Values.bring.email | quote }}
  BRING_PASSWORD: {{ required "bring.password is required when bring.existingSecret is not set" .Values.bring.password | quote }}
  MCP_API_KEY: {{ required "bring.apiKey is required when bring.existingSecret is not set" .Values.bring.apiKey | quote }}
{{- end }}
