{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bring-hermes.fullname" . }}
  labels:
    {{- include "bring-hermes.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "secrets.databaseUrl is required when existingSecret is not set" .Values.secrets.databaseUrl | quote }}
  TOKEN_ENCRYPTION_KEY: {{ required "secrets.tokenEncryptionKey is required when existingSecret is not set" .Values.secrets.tokenEncryptionKey | quote }}
{{- end }}
