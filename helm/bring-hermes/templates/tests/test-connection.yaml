apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "bring-hermes.fullname" . }}-test-connection"
  labels:
    {{- include "bring-hermes.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: healthcheck
      image: curlimages/curl:8.10.1
      command: ["curl"]
      args:
        - "-sf"
        - "http://{{ include "bring-hermes.fullname" . }}:{{ .Values.service.port }}/healthz"
