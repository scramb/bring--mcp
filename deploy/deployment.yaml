# One replica: the Bring! sessions are cached in memory and the login
# rate limit is per process. The state that matters (OAuth clients,
# tokens, linked accounts) lives in Postgres (database.yaml).
#
# The pod joins the Istio ambient mesh (istio.io/dataplane-mode below):
# tethys only lets the public gateway's identity open a connection to it
# (base-setup/workloads/bring-mcp/isolation.yaml). Kubelet probes are
# exempt.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bring-hermes
  labels:
    app.kubernetes.io/name: bring-hermes
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bring-hermes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bring-hermes
        istio.io/dataplane-mode: ambient
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bring-hermes
          image: ghcr.io/scramb/bring--mcp
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PUBLIC_URL
              value: https://bring.meininger.cloud
            # Assembled from the Secret CloudNativePG generates for the role
            # "bring" (database.yaml); the password is alphanumeric.
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: bring-mcp-db-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bring-mcp-db-app
                  key: password
            - name: DATABASE_URL
              value: postgres://$(DB_USER):$(DB_PASSWORD)@bring-mcp-db-rw:5432/bring?sslmode=require
            - name: PORT
              value: "8080"
            - name: MCP_PATH
              value: /mcp
            - name: MCP_JSON_RESPONSE
              value: "true"
            - name: LOG_LEVEL
              value: INFO
          envFrom:
            - secretRef:
                name: bring-hermes-credentials
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          # 503 while the database is unreachable.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 20m
              memory: 96Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
