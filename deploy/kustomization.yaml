apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The deployment of bring-hermes on tethys (github.com/scramb/tethys).
# Flux there fetches ./deploy from the master branch of this repo and
# applies it into the namespace bring-mcp; a rollout is a commit here
# (deploy/README.md). Namespace, isolation and the guard on the public
# gateway stay in tethys, base-setup/workloads/bring-mcp.
namespace: bring-mcp
resources:
  - credentials.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml

# The one place the running version is decided: a release tag of this
# repo, never "latest". No image automation.
images:
  - name: ghcr.io/scramb/bring--mcp
    newTag: "0.3.0"
