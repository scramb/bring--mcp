# Public at https://bring.meininger.cloud on the istio-ingress gateway of
# tethys, TLS from the *.meininger.cloud wildcard certificate.
#
# The whole host goes to the app: the MCP endpoint (/mcp), the OAuth
# endpoints and metadata (/.well-known/*, /authorize, /token, /register,
# /revoke) and the Bring! login page (/login). The app itself decides who
# gets in -- every MCP request needs an OAuth access token it issued.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bring-hermes
spec:
  parentRefs:
    - name: istio-ingress
      namespace: istio-ingress
      sectionName: https-meininger-wildcard
  hostnames:
    - bring.meininger.cloud
  rules:
    - backendRefs:
        - name: bring-hermes
          port: 8080
