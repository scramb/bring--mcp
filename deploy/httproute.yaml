# Public at https://bring.meininger.cloud/mcp on the istio-ingress gateway
# of tethys, TLS from the *.meininger.cloud wildcard certificate.
#
# The API key is the only credential: there is no browser surface and no
# Ory login in front of it. tethys rejects every request to this host
# that carries no Authorization header at the gateway, before it reaches
# the pod (base-setup/workloads/bring-mcp/public-gate.yaml). Clients
# therefore send "Authorization: Bearer <key>"; X-API-Key alone is
# refused publicly.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bring-hermes
spec:
  parentRefs:
    - name: istio-ingress
      namespace: istio-ingress
      sectionName: https-meininger-wildcard
  hostnames:
    - bring.meininger.cloud
  rules:
    - backendRefs:
        - name: bring-hermes
          port: 8080
