# BRING_EMAIL, BRING_PASSWORD and MCP_API_KEY from the platform's secret
# store (OpenBao on tethys). Nothing that grants access is in Git. Two
# paths, because they have different owners: the Bring! login is typed in
# by the owner, the API key is generated and rotated on its own:
#
#   kv/bring-mcp/bring    email, password
#   kv/bring-mcp/api-key  api_key  (comma-separated for rotation)
#
# Until both exist this ExternalSecret reports SecretSyncedError and the
# pod waits in CreateContainerConfigError.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bring-hermes-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: bring-hermes-credentials
  data:
    - secretKey: BRING_EMAIL
      remoteRef:
        key: bring-mcp/bring
        property: email
    - secretKey: BRING_PASSWORD
      remoteRef:
        key: bring-mcp/bring
        property: password
    - secretKey: MCP_API_KEY
      remoteRef:
        key: bring-mcp/api-key
        property: api_key
