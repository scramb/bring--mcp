# TOKEN_ENCRYPTION_KEY from the platform's secret store (OpenBao on
# tethys): the Fernet key the Bring! refresh tokens are encrypted with in
# the database. Nothing that grants access is in Git; there is no Bring!
# account here any more -- every user links their own at the OAuth login.
#
#   kv/bring-mcp/encryption-key  key
#
# Losing or changing the key makes the stored Bring! sessions unreadable:
# every user then has to sign in once more, nothing else breaks.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bring-hermes-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: bring-hermes-credentials
    creationPolicy: Owner
  data:
    - secretKey: TOKEN_ENCRYPTION_KEY
      remoteRef:
        key: bring-mcp/encryption-key
        property: key
